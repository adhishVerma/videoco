server {
    listen 80;
    # turn.ballasgang.shop is listed here too so this same nginx/certbot
    # flow can issue one cert covering both - coturn reads it directly for
    # its TLS listener (5349), it doesn't otherwise talk to nginx at all.
    server_name api.ballasgang.shop turn.ballasgang.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.ballasgang.shop;

    ssl_certificate /etc/letsencrypt/live/api.ballasgang.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ballasgang.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # Express's JSON responses and Socket.IO's WebSocket upgrade both go
    # through this one proxy block.
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO connections are long-lived - the default 60s proxy
        # timeout would silently drop idle calls.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
